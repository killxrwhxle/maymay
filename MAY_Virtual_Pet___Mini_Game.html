<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>귀여운 마이(MAY)와 함께하는 나날</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DungGeunMo&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            box-sizing: border-box;
            font-family: 'DungGeunMo', monospace, sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a102f;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: block;
        }

        .pixel-box {
            border: 4px solid #4a3b5c;
            box-shadow: inset -4px -4px 0px 0px #2a1f3d, inset 4px 4px 0px 0px #8b71a8, 0 8px 0 0 rgba(0,0,0,0.4);
            background-color: #382b4a;
            color: #ffffff;
        }

        .pixel-btn {
            border: 3px solid #3d2218;
            background-color: #fca311;
            box-shadow: inset -3px -3px 0px 0px #b56c00, inset 3px 3px 0px 0px #ffc857;
            color: #2b1704;
            transition: transform 0.05s, background-color 0.1s;
            cursor: pointer;
            text-shadow: 1px 1px 0px #ffe599;
        }

        .pixel-btn:active {
            transform: translateY(2px);
            box-shadow: inset -1px -1px 0px 0px #b56c00, inset 1px 1px 0px 0px #ffc857;
        }

        .pixel-btn-purple {
            border: 3px solid #231238;
            background-color: #9d4edd;
            box-shadow: inset -3px -3px 0px 0px #5a189a, inset 3px 3px 0px 0px #e0aaff;
            color: #ffffff;
            text-shadow: 1px 1px 0px #3c096c;
        }

        .pixel-btn-purple:active {
            transform: translateY(2px);
        }

        /* Prevent context menu and callouts on touch hold */
        body {
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }
    </style>
</head>
<body class="select-none touch-none">

    <!-- Container maintaining 16:9 or auto mobile scaling -->
    <div id="game-container" class="relative w-full h-full max-w-[800px] max-h-[600px] flex flex-col justify-between items-center p-2 sm:p-4 overflow-hidden">
        
        <!-- Game Canvas Layer -->
        <canvas id="mainCanvas" class="w-full h-full absolute inset-0 z-0 rounded-lg shadow-2xl"></canvas>

        <!-- UI Top Overlay (Main Room Mode) -->
        <div id="room-ui" class="relative z-10 w-full flex justify-between items-center p-2">
            <div class="pixel-box px-3 py-1 text-xs sm:text-sm rounded flex items-center gap-2 bg-opacity-90">
                <span>🐾 마이(MAY)</span>
                <span class="text-yellow-300">오드아이 고양이</span>
            </div>
            <button id="btn-minigame" class="pixel-btn px-3 py-2 sm:px-4 sm:py-2 text-sm sm:text-base font-bold rounded flex items-center gap-1">
                🎮 미니게임 시작
            </button>
        </div>

        <!-- UI Top Overlay (Mini Game Mode) -->
        <div id="game-ui" class="relative z-10 w-full flex justify-between items-center p-2 hidden">
            <button id="btn-game-back" class="pixel-btn-purple px-3 py-1.5 text-xs sm:text-sm font-bold rounded">
                ⬅ 돌아가기
            </button>
            
            <div class="flex items-center gap-3 pixel-box px-3 py-1 text-xs sm:text-sm rounded bg-opacity-90">
                <div id="game-score" class="text-yellow-300 font-bold">점수: 0</div>
                <div id="game-lives" class="text-red-400">❤️❤️❤️</div>
            </div>

            <button id="btn-game-pause" class="pixel-btn-purple px-3 py-1.5 text-xs sm:text-sm font-bold rounded">
                ⏸️ 일시정지
            </button>
        </div>

        <!-- Touch Controls Overlay for Mobile Game Control -->
        <div id="touch-controls" class="relative z-10 w-full flex justify-between px-6 pb-2 hidden sm:hidden">
            <button id="btn-touch-left" class="pixel-btn w-16 h-16 rounded-full text-2xl font-bold flex items-center justify-center active:bg-yellow-500 opacity-80">
                ◀
            </button>
            <button id="btn-touch-right" class="pixel-btn w-16 h-16 rounded-full text-2xl font-bold flex items-center justify-center active:bg-yellow-500 opacity-80">
                ▶
            </button>
        </div>

        <!-- Bottom Dialogue & Status Box -->
        <div id="dialogue-container" class="relative z-10 w-full">
            <div class="pixel-box w-full p-3 sm:p-4 rounded-lg bg-opacity-95 flex flex-col gap-1 min-h-[76px] justify-center">
                <div class="flex items-center justify-between border-b border-purple-400/30 pb-1 mb-1">
                    <span id="dialogue-speaker" class="text-xs sm:text-sm text-purple-300 font-bold">마이 (MAY)</span>
                    <span class="text-[10px] sm:text-xs text-gray-400">터치해서 고양이와 교감해보세요!</span>
                </div>
                <p id="dialogue-text" class="text-xs sm:text-base leading-relaxed text-yellow-100">
                    야옹~ 방 안에서 따뜻한 햇살을 쬐고 있다냥! 🐾
                </p>
            </div>
        </div>

        <!-- Pause Modal -->
        <div id="pause-modal" class="absolute inset-0 z-30 bg-black/70 flex flex-col items-center justify-center gap-4 hidden">
            <div class="pixel-box p-6 rounded-lg text-center max-w-xs w-full">
                <h2 class="text-xl font-bold text-yellow-300 mb-4">⏸️ 일시정지됨</h2>
                <div class="flex flex-col gap-3">
                    <button id="btn-resume" class="pixel-btn py-2 text-sm font-bold rounded">▶ 계속하기</button>
                    <button id="btn-restart" class="pixel-btn py-2 text-sm font-bold rounded">🔄 재도전</button>
                    <button id="btn-pause-exit" class="pixel-btn-purple py-2 text-sm font-bold rounded">🏠 돌아가기</button>
                </div>
            </div>
        </div>

        <!-- Game Over Modal -->
        <div id="gameover-modal" class="absolute inset-0 z-30 bg-black/75 flex flex-col items-center justify-center gap-4 hidden">
            <div class="pixel-box p-6 rounded-lg text-center max-w-xs w-full">
                <h2 class="text-xl font-bold text-red-400 mb-2">😿 게임 오버!</h2>
                <p class="text-xs text-gray-300 mb-3">털뭉치를 너무 많이 피하지 못했다냥...</p>
                <div class="bg-black/40 p-3 rounded mb-4 text-sm">
                    <div>최종 점수: <span id="final-score" class="text-yellow-300 font-bold">0</span>점</div>
                    <div class="text-xs text-purple-300 mt-1">최고 기록: <span id="high-score">0</span>점</div>
                </div>
                <div class="flex flex-col gap-2">
                    <button id="btn-gameover-restart" class="pixel-btn py-2 text-sm font-bold rounded">🔄 다시 도전하기</button>
                    <button id="btn-gameover-exit" class="pixel-btn-purple py-2 text-sm font-bold rounded">🏠 돌아가기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Engine Logic -->
    <script>
        /* --- Web Audio Synthesizer (8-Bit Retro Chiptune SFX) --- */
        class RetroAudio {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // High pitched cute meow sound synthesizer
            playMeow() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                // Frequency pitch curve simulating a cat meow
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.linearRampToValueAtTime(880, now + 0.12);
                osc.frequency.exponentialRampToValueAtTime(500, now + 0.35);

                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.3, now + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.35);
            }

            // Fish catch sound (Upward frequency arpeggio)
            playCatch() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'square';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.setValueAtTime(600, now + 0.05);
                osc.frequency.setValueAtTime(800, now + 0.1);

                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.18);
            }

            // Hairball hit sound (Low buzz noise)
            playHit() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.linearRampToValueAtTime(70, now + 0.2);

                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.2);
            }

            // Game over sound
            playGameOver() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(350, now);
                osc.frequency.setValueAtTime(300, now + 0.15);
                osc.frequency.setValueAtTime(250, now + 0.3);
                osc.frequency.setValueAtTime(180, now + 0.45);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.75);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.75);
            }
        }

        const audio = new RetroAudio();

        /* --- Canvas & Pixel Graphic Engine --- */
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');

        // Virtual Pixel Grid Resolution (High detail pixel scale)
        const V_WIDTH = 320;
        const V_HEIGHT = 240;

        // Offscreen canvas for crisp pixel rendering
        const pixelBuffer = document.createElement('canvas');
        pixelBuffer.width = V_WIDTH;
        pixelBuffer.height = V_HEIGHT;
        const pCtx = pixelBuffer.getContext('2d');

        function resizeCanvas() {
            const container = document.getElementById('game-container');
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        /* --- State Management --- */
        let currentMode = 'ROOM'; // 'ROOM' or 'GAME'
        let gamePaused = false;
        let gameOver = false;

        // Random dialogue lists
        const touchDialogues = [
            "야옹~ 젤리가 몰랑몰랑해서 기분 좋다냥! 🐾",
            "골골골... 집사 손길이 제일 좋다냥! ❤️",
            "야옹! 심심했는데 더 쓰다듬어달라냥!",
            "마이의 왼쪽 눈은 골드, 오른쪽 눈은 에메랄드 블루라냥! ✨",
            "MAY목걸이는 마이의 소중한 보물이다냥!",
            "골골골... 마이는 지금 행복하다냥~ 💤",
            "따뜻한 햇빛을 받아 졸음이 쏟아진다냥..."
        ];

        const idleScratchDialogues = [
            "마이가 뒷발로 귀 뒤를 야무지게 긁적입니다 🐾",
            "쓱쓱쓱! 귀 뒤가 가려웠다냥!",
            "마이가 앙증맞은 뒷발을 바쁘게 움직입니다."
        ];

        const idleWashDialogues = [
            "마이가 핥은 앞발로 야무지게 세수를 합니다 🧼",
            "쓱싹쓱싹, 단정한 고양이는 세수를 게을리하지 않는다냥!",
            "마이가 털을 단정하게 정돈하고 있습니다."
        ];

        /* --- Cat Character (MAY) State & Animation Systems --- */
        const cat = {
            x: V_WIDTH / 2,
            y: 165,
            width: 36,
            height: 38,
            state: 'IDLE', // IDLE, SCRATCH, WASH, MEOW, RUN
            facingLeft: true,
            frame: 0,
            animTimer: 0,
            
            // Random Action Timers
            scratchTimer: 0,
            washTimer: 0,

            // Touch Bounce scale
            scaleY: 1,
            scaleX: 1
        };

        // Initialize random trigger times (Scratch ~2/min, Wash ~1/min)
        function resetActionTimers() {
            // ~25 to 35 seconds for scratch
            cat.scratchTimer = (20 + Math.random() * 15) * 60;
            // ~50 to 70 seconds for wash
            cat.washTimer = (45 + Math.random() * 25) * 60;
        }
        resetActionTimers();

        /* --- Mini-Game Logic --- */
        const game = {
            score: 0,
            lives: 3,
            highScore: localStorage.getItem('may_cat_highscore') || 0,
            items: [],
            spawnTimer: 0,
            spawnInterval: 45,
            playerX: V_WIDTH / 2,
            playerSpeed: 3.2,
            keys: { left: false, right: false }
        };

        // Prevent browser defaults on game arrow key controls
        window.addEventListener('keydown', (e) => {
            if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' ', 'a', 'A', 'd', 'D'].includes(e.key)) {
                e.preventDefault();
            }
            if (currentMode === 'GAME' && !gamePaused && !gameOver) {
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') game.keys.left = true;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') game.keys.right = true;
            }
        }, { passive: false });

        window.addEventListener('keyup', (e) => {
            if (['ArrowLeft', 'ArrowRight', 'a', 'A', 'd', 'D'].includes(e.key)) {
                e.preventDefault();
            }
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') game.keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') game.keys.right = false;
        }, { passive: false });

        // Touch Control Listeners for Mobile
        const btnLeft = document.getElementById('btn-touch-left');
        const btnRight = document.getElementById('btn-touch-right');

        const bindTouch = (btn, key) => {
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); game.keys[key] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); game.keys[key] = false; });
            btn.addEventListener('mousedown', (e) => { e.preventDefault(); game.keys[key] = true; });
            btn.addEventListener('mouseup', (e) => { e.preventDefault(); game.keys[key] = false; });
        };
        bindTouch(btnLeft, 'left');
        bindTouch(btnRight, 'right');

        /* --- Pixel Art Drawing Functions --- */

        // Render Room Background (Wood floor + soft purple wallpaper + bed corner)
        function drawRoomBackground() {
            // Wall (Soft Pastel Purple wallpaper with subtle vertical stripe detail)
            pCtx.fillStyle = '#b8a2d1';
            pCtx.fillRect(0, 0, V_WIDTH, 150);

            pCtx.fillStyle = '#c5b1dd';
            for (let x = 0; x < V_WIDTH; x += 16) {
                pCtx.fillRect(x, 0, 8, 150);
            }

            // Baseboard
            pCtx.fillStyle = '#5c4033';
            pCtx.fillRect(0, 146, V_WIDTH, 6);
            pCtx.fillStyle = '#3d2b22';
            pCtx.fillRect(0, 151, V_WIDTH, 1);

            // Wood Floor Boards
            pCtx.fillStyle = '#d2a679';
            pCtx.fillRect(0, 152, V_WIDTH, 88);

            // Floor Plank Lines
            pCtx.fillStyle = '#b5895a';
            for (let y = 166; y < V_HEIGHT; y += 14) {
                pCtx.fillRect(0, y, V_WIDTH, 1);
            }
            for (let y = 152; y < V_HEIGHT; y += 14) {
                for (let x = (y * 3) % 40; x < V_WIDTH; x += 60) {
                    pCtx.fillRect(x, y, 1, 14);
                }
            }

            // Bed in the corner (Left side)
            // Bed frame
            pCtx.fillStyle = '#7a5230';
            pCtx.fillRect(0, 120, 55, 45);
            // Blanket (Cozy Mint/Cyan)
            pCtx.fillStyle = '#94d2bd';
            pCtx.fillRect(0, 125, 50, 35);
            pCtx.fillStyle = '#e9d8a6'; // Blanket trim
            pCtx.fillRect(45, 125, 5, 35);
            // Pillow
            pCtx.fillStyle = '#ffffff';
            pCtx.fillRect(5, 122, 22, 12);
            pCtx.fillStyle = '#e0e0e0';
            pCtx.fillRect(5, 132, 22, 2);

            // Cozy Rug under cat
            pCtx.fillStyle = '#f4acb7';
            pCtx.beginPath();
            pCtx.ellipse(V_WIDTH / 2, 185, 48, 18, 0, 0, Math.PI * 2);
            pCtx.fill();
            pCtx.fillStyle = '#ffcad4';
            pCtx.beginPath();
            pCtx.ellipse(V_WIDTH / 2, 185, 42, 15, 0, 0, Math.PI * 2);
            pCtx.fill();

            // Window showing starry night/sky on the right
            pCtx.fillStyle = '#5c4033'; // Window frame
            pCtx.fillRect(230, 25, 60, 70);
            pCtx.fillStyle = '#1d3557'; // Window glass
            pCtx.fillRect(234, 29, 52, 62);
            // Stars in window
            pCtx.fillStyle = '#f1faee';
            pCtx.fillRect(245, 40, 2, 2);
            pCtx.fillRect(270, 55, 2, 2);
            pCtx.fillRect(255, 70, 2, 2);
            // Moon
            pCtx.fillStyle = '#ffb703';
            pCtx.fillRect(268, 36, 8, 8);
            // Window grid
            pCtx.fillStyle = '#5c4033';
            pCtx.fillRect(259, 29, 2, 62);
            pCtx.fillRect(234, 58, 52, 2);
        }

        /* --- Draw Detailed Short-Haired White Cat (MAY) with Heterochromia & Tag --- */
        function drawCat(cx, cy, frame, state, scaleX = 1, scaleY = 1) {
            pCtx.save();
            pCtx.translate(cx, cy);
            pCtx.scale(scaleX, scaleY);

            // Shadow
            pCtx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            pCtx.beginPath();
            pCtx.ellipse(0, 16, 16, 6, 0, 0, Math.PI * 2);
            pCtx.fill();

            // Main White Body Pixel Render
            pCtx.fillStyle = '#ffffff'; // Base White Fur
            pCtx.strokeStyle = '#e0e0e0'; // Fur shading

            // Body
            pCtx.fillRect(-12, -10, 24, 22);
            pCtx.fillRect(-14, -6, 28, 16);

            // Tail (wagging animation)
            const tailY = Math.sin(frame * 0.15) * 3;
            pCtx.lineWidth = 3;
            pCtx.strokeStyle = '#ffffff';
            pCtx.beginPath();
            pCtx.moveTo(10, 8);
            pCtx.quadraticCurveTo(20, 5 + tailY, 18, -6 + tailY);
            pCtx.stroke();

            // Paws (Sitting stance)
            pCtx.fillStyle = '#f5f5f5';
            pCtx.fillRect(-10, 10, 8, 6);
            pCtx.fillRect(2, 10, 8, 6);
            // Pink toe beans accent line
            pCtx.fillStyle = '#ffb5a7';
            pCtx.fillRect(-9, 15, 6, 1);
            pCtx.fillRect(3, 15, 6, 1);

            // Red Collar & "MAY" Tag
            pCtx.fillStyle = '#e63946'; // Red Collar
            pCtx.fillRect(-9, -8, 18, 3);
            pCtx.fillStyle = '#ffb703'; // Gold Tag
            pCtx.fillRect(-3, -5, 6, 5);
            // Tag text "MAY" micro pixels
            pCtx.fillStyle = '#000000';
            pCtx.fillRect(-2, -4, 1, 3);
            pCtx.fillRect(0, -4, 1, 3);
            pCtx.fillRect(1, -4, 1, 3);

            // Head Base
            pCtx.fillStyle = '#ffffff';
            pCtx.fillRect(-15, -28, 30, 20);
            pCtx.fillRect(-16, -25, 32, 15);

            // Ears
            // Left Ear
            pCtx.fillRect(-14, -34, 8, 8);
            pCtx.fillRect(-12, -36, 4, 4);
            pCtx.fillStyle = '#ffcad4'; // Inner Ear Pink
            pCtx.fillRect(-12, -32, 4, 5);

            // Right Ear
            pCtx.fillStyle = '#ffffff';
            pCtx.fillRect(6, -34, 8, 8);
            pCtx.fillRect(8, -36, 4, 4);
            pCtx.fillStyle = '#ffcad4'; // Inner Ear Pink
            pCtx.fillRect(8, -32, 4, 5);

            // Ear Scratching Animation Pose Overlay
            if (state === 'SCRATCH') {
                const scratchLegOffset = (Math.floor(frame / 3) % 2 === 0) ? -4 : 2;
                // Raised hind leg
                pCtx.fillStyle = '#f0f0f0';
                pCtx.fillRect(-18, -20 + scratchLegOffset, 8, 14);
                // Tilted Head
                pCtx.fillStyle = '#ffffff';
                pCtx.fillRect(-16, -26, 30, 18);
            }

            // Paw Wash Grooming Animation Pose
            if (state === 'WASH') {
                const washOffset = (Math.floor(frame / 6) % 2 === 0) ? -2 : 0;
                // Paw licking near face
                pCtx.fillStyle = '#ffffff';
                pCtx.fillRect(-6, -22 + washOffset, 8, 8);
                pCtx.fillStyle = '#ffb5a7'; // Pink tongue/paw
                pCtx.fillRect(-4, -20 + washOffset, 4, 3);
            }

            // Eyes - Heterochromia (Left Eye: Yellow/Gold, Right Eye: Blue)
            const blink = (frame % 120 > 115) && state === 'IDLE';

            if (blink || state === 'SCRATCH') {
                // Happy closed eyes `^ ^`
                pCtx.strokeStyle = '#4a4a4a';
                pCtx.lineWidth = 1.5;
                pCtx.beginPath();
                pCtx.arc(-7, -18, 3, Math.PI, 0);
                pCtx.arc(7, -18, 3, Math.PI, 0);
                pCtx.stroke();
            } else {
                // Left Eye: Yellow / Gold
                pCtx.fillStyle = '#ffb703';
                pCtx.fillRect(-10, -21, 6, 7);
                pCtx.fillStyle = '#000000'; // Pupil
                pCtx.fillRect(-8, -20, 2, 5);
                pCtx.fillStyle = '#ffffff'; // Shine
                pCtx.fillRect(-10, -21, 2, 2);

                // Right Eye: Deep Sapphire Blue
                pCtx.fillStyle = '#2196f3';
                pCtx.fillRect(4, -21, 6, 7);
                pCtx.fillStyle = '#000000'; // Pupil
                pCtx.fillRect(6, -20, 2, 5);
                pCtx.fillStyle = '#ffffff'; // Shine
                pCtx.fillRect(4, -21, 2, 2);
            }

            // Cute Nose & Mouth
            pCtx.fillStyle = '#ffb5a7'; // Pink nose
            pCtx.fillRect(-1, -14, 3, 2);

            pCtx.strokeStyle = '#757575';
            pCtx.lineWidth = 1;
            pCtx.beginPath();
            pCtx.moveTo(0, -12);
            pCtx.lineTo(-2, -10);
            pCtx.moveTo(0, -12);
            pCtx.lineTo(2, -10);
            pCtx.stroke();

            // Cute Whiskers
            pCtx.strokeStyle = '#cccccc';
            pCtx.beginPath();
            // Left whiskers
            pCtx.moveTo(-12, -14); pCtx.lineTo(-20, -16);
            pCtx.moveTo(-12, -12); pCtx.lineTo(-21, -11);
            // Right whiskers
            pCtx.moveTo(12, -14); pCtx.lineTo(20, -16);
            pCtx.moveTo(12, -12); pCtx.lineTo(21, -11);
            pCtx.stroke();

            pCtx.restore();
        }

        /* --- Draw Mini-Game Sky & Objects --- */

        function drawGameBackground() {
            // Gradient Sky
            const skyGrad = pCtx.createLinearGradient(0, 0, 0, V_HEIGHT);
            skyGrad.addColorStop(0, '#1d3557');
            skyGrad.addColorStop(0.7, '#457b9d');
            skyGrad.addColorStop(1, '#a8dadc');
            pCtx.fillStyle = skyGrad;
            pCtx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

            // Soft pixel clouds floating
            pCtx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            pCtx.fillRect(20, 30, 40, 12);
            pCtx.fillRect(180, 50, 55, 15);
            pCtx.fillRect(100, 80, 35, 10);

            // Ground Grass
            pCtx.fillStyle = '#2a9d8f';
            pCtx.fillRect(0, V_HEIGHT - 20, V_WIDTH, 20);
            pCtx.fillStyle = '#e9c46a';
            pCtx.fillRect(0, V_HEIGHT - 20, V_WIDTH, 2);
        }

        // Draw Blue Fish (+10 Pts)
        function drawBlueFish(x, y) {
            pCtx.fillStyle = '#0077b6';
            pCtx.fillRect(x - 6, y - 3, 12, 6);
            pCtx.fillRect(x - 8, y - 2, 2, 4); // Tail
            pCtx.fillStyle = '#90e0ef';
            pCtx.fillRect(x - 4, y - 2, 4, 3);
            pCtx.fillStyle = '#ffffff'; // Eye
            pCtx.fillRect(x + 3, y - 2, 2, 2);
            pCtx.fillStyle = '#000000';
            pCtx.fillRect(x + 4, y - 2, 1, 1);
        }

        // Draw Golden Fish (+30 Pts)
        function drawGoldFish(x, y) {
            pCtx.fillStyle = '#ffb703';
            pCtx.fillRect(x - 7, y - 4, 14, 8);
            pCtx.fillRect(x - 10, y - 3, 3, 6); // Tail
            pCtx.fillStyle = '#ffe5ec';
            pCtx.fillRect(x - 5, y - 2, 5, 4);
            pCtx.fillStyle = '#ffffff'; // Eye
            pCtx.fillRect(x + 3, y - 3, 3, 3);
            pCtx.fillStyle = '#000000';
            pCtx.fillRect(x + 4, y - 2, 1, 1);
        }

        // Draw Hairball (-1 Life)
        function drawHairball(x, y, frame) {
            pCtx.fillStyle = '#6c757d';
            pCtx.beginPath();
            pCtx.arc(x, y, 7, 0, Math.PI * 2);
            pCtx.fill();

            // Stray hair bits
            pCtx.strokeStyle = '#495057';
            pCtx.lineWidth = 1;
            const rot = (frame % 20) * 0.3;
            for (let i = 0; i < 4; i++) {
                const ang = rot + (i * Math.PI / 2);
                pCtx.beginPath();
                pCtx.moveTo(x, y);
                pCtx.lineTo(x + Math.cos(ang) * 9, y + Math.sin(ang) * 9);
                pCtx.stroke();
            }
        }

        /* --- Dialogue Manager --- */
        const dialogueText = document.getElementById('dialogue-text');
        
        function setDialogue(msg) {
            dialogueText.textContent = msg;
        }

        /* --- Input & Touch Interaction (Petting MAY) --- */
        function checkCatClick(clickX, clickY) {
            if (currentMode !== 'ROOM') return;

            // Map canvas click coordinate to virtual buffer coordinate
            const rect = canvas.getBoundingClientRect();
            const scaleX = V_WIDTH / rect.width;
            const scaleY = V_HEIGHT / rect.height;

            const vx = (clickX - rect.left) * scaleX;
            const vy = (clickY - rect.top) * scaleY;

            // Cat bounding box check
            if (Math.abs(vx - cat.x) < 25 && Math.abs(vy - (cat.y - 10)) < 25) {
                // Petting Trigger
                audio.playMeow();
                cat.scaleX = 1.15;
                cat.scaleY = 0.85; // Bounce squash effect
                cat.state = 'MEOW';
                
                const randomMsg = touchDialogues[Math.floor(Math.random() * touchDialogues.length)];
                setDialogue(randomMsg);
            }
        }

        canvas.addEventListener('click', (e) => checkCatClick(e.clientX, e.clientY));
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                checkCatClick(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        /* --- Game Flow Controls --- */
        const roomUI = document.getElementById('room-ui');
        const gameUI = document.getElementById('game-ui');
        const touchControls = document.getElementById('touch-controls');
        const pauseModal = document.getElementById('pause-modal');
        const gameoverModal = document.getElementById('gameover-modal');

        function startMiniGame() {
            audio.init();
            currentMode = 'GAME';
            gamePaused = false;
            gameOver = false;
            game.score = 0;
            game.lives = 3;
            game.items = [];
            game.playerX = V_WIDTH / 2;

            updateGameUI();
            roomUI.classList.add('hidden');
            gameUI.classList.remove('hidden');
            touchControls.classList.remove('hidden');
            pauseModal.classList.add('hidden');
            gameoverModal.classList.add('hidden');

            setDialogue("미니게임 시작! 하늘에서 떨어지는 생선을 가방 가득 모으자냥! 🐟");
        }

        function exitToRoom() {
            currentMode = 'ROOM';
            gamePaused = false;
            gameOver = false;

            roomUI.classList.remove('hidden');
            gameUI.classList.add('hidden');
            touchControls.classList.add('hidden');
            pauseModal.classList.add('hidden');
            gameoverModal.classList.add('hidden');

            setDialogue("다시 따뜻한 방으로 돌아왔다냥! 🐾");
        }

        function pauseGame() {
            if (currentMode !== 'GAME' || gameOver) return;
            gamePaused = true;
            pauseModal.classList.remove('hidden');
        }

        function resumeGame() {
            gamePaused = false;
            pauseModal.classList.add('hidden');
        }

        function updateGameUI() {
            document.getElementById('game-score').textContent = `점수: ${game.score}`;
            document.getElementById('game-lives').textContent = '❤️'.repeat(Math.max(0, game.lives));
        }

        function triggerGameOver() {
            gameOver = true;
            audio.playGameOver();
            
            if (game.score > game.highScore) {
                game.highScore = game.score;
                localStorage.setItem('may_cat_highscore', game.highScore);
            }

            document.getElementById('final-score').textContent = game.score;
            document.getElementById('high-score').textContent = game.highScore;
            gameoverModal.classList.remove('hidden');
        }

        // Button Listeners
        document.getElementById('btn-minigame').addEventListener('click', startMiniGame);
        document.getElementById('btn-game-back').addEventListener('click', exitToRoom);
        document.getElementById('btn-game-pause').addEventListener('click', pauseGame);
        document.getElementById('btn-resume').addEventListener('click', resumeGame);
        document.getElementById('btn-restart').addEventListener('click', startMiniGame);
        document.getElementById('btn-pause-exit').addEventListener('click', exitToRoom);
        document.getElementById('btn-gameover-restart').addEventListener('click', startMiniGame);
        document.getElementById('btn-gameover-exit').addEventListener('click', exitToRoom);

        /* --- Main Loop Updates --- */

        let frameCount = 0;

        function updateRoomMode() {
            cat.frame++;

            // Smooth scale recovery after petting bounce
            cat.scaleX += (1 - cat.scaleX) * 0.1;
            cat.scaleY += (1 - cat.scaleY) * 0.1;

            if (cat.state === 'IDLE') {
                // Countdown action timers
                cat.scratchTimer--;
                cat.washTimer--;

                if (cat.scratchTimer <= 0) {
                    cat.state = 'SCRATCH';
                    cat.animTimer = 60; // ~1 second animation (3 fast scratch cycles)
                    const msg = idleScratchDialogues[Math.floor(Math.random() * idleScratchDialogues.length)];
                    setDialogue(msg);
                } else if (cat.washTimer <= 0) {
                    cat.state = 'WASH';
                    cat.animTimer = 90; // ~1.5 seconds grooming animation
                    const msg = idleWashDialogues[Math.floor(Math.random() * idleWashDialogues.length)];
                    setDialogue(msg);
                }
            } else if (cat.state === 'SCRATCH' || cat.state === 'WASH' || cat.state === 'MEOW') {
                cat.animTimer--;
                if (cat.animTimer <= 0) {
                    cat.state = 'IDLE';
                    resetActionTimers();
                }
            }
        }

        function updateGameMode() {
            if (gamePaused || gameOver) return;

            frameCount++;

            // Move Player
            if (game.keys.left) {
                game.playerX -= game.playerSpeed;
            }
            if (game.keys.right) {
                game.playerX += game.playerSpeed;
            }
            // Clamp player within canvas bounds
            game.playerX = Math.max(16, Math.min(V_WIDTH - 16, game.playerX));

            // Spawn Falling Items
            game.spawnTimer++;
            if (game.spawnTimer >= game.spawnInterval) {
                game.spawnTimer = 0;
                const rx = 20 + Math.random() * (V_WIDTH - 40);
                const randVal = Math.random();
                let type = 'BLUE';
                if (randVal < 0.60) type = 'BLUE';      // 60% Blue Fish (+10)
                else if (randVal < 0.82) type = 'GOLD'; // 22% Golden Fish (+30)
                else type = 'HAIRBALL';                 // 18% Hairball (-1 Life)

                const speed = 1.2 + Math.random() * 1.5;
                game.items.push({ x: rx, y: -10, type, speed });
            }

            // Update Items & Collision Detection
            for (let i = game.items.length - 1; i >= 0; i--) {
                const item = game.items[i];
                item.y += item.speed;

                // Collision with Cat Player (Catch area)
                const dist = Math.hypot(item.x - game.playerX, item.y - (V_HEIGHT - 25));
                if (dist < 18) {
                    if (item.type === 'BLUE') {
                        game.score += 10;
                        audio.playCatch();
                    } else if (item.type === 'GOLD') {
                        game.score += 30;
                        audio.playCatch();
                    } else if (item.type === 'HAIRBALL') {
                        game.lives--;
                        audio.playHit();
                        if (game.lives <= 0) {
                            triggerGameOver();
                        }
                    }
                    updateGameUI();
                    game.items.splice(i, 1);
                    continue;
                }

                // Item falls past bottom floor
                if (item.y > V_HEIGHT + 10) {
                    game.items.splice(i, 1);
                }
            }
        }

        /* --- Main Render Loop --- */

        function render() {
            pCtx.clearRect(0, 0, V_WIDTH, V_HEIGHT);

            if (currentMode === 'ROOM') {
                updateRoomMode();
                drawRoomBackground();
                drawCat(cat.x, cat.y, cat.frame, cat.state, cat.scaleX, cat.scaleY);
            } else {
                updateGameMode();
                drawGameBackground();

                // Draw Falling Items
                game.items.forEach(item => {
                    if (item.type === 'BLUE') drawBlueFish(item.x, item.y);
                    else if (item.type === 'GOLD') drawGoldFish(item.x, item.y);
                    else if (item.type === 'HAIRBALL') drawHairball(item.x, item.y, frameCount);
                });

                // Draw Catching Cat at Bottom
                drawCat(game.playerX, V_HEIGHT - 25, frameCount, 'IDLE', 0.9, 0.9);
            }

            // Upscale virtual pixel canvas to main screen canvas with crisp pixelation
            ctx.imageSmoothingEnabled = false;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(pixelBuffer, 0, 0, canvas.width, canvas.height);

            requestAnimationFrame(render);
        }

        // Start App Loop when Window Loads
        window.onload = function() {
            requestAnimationFrame(render);
        };
    </script>
</body>
</html>
